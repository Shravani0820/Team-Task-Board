<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Team Board</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5f0;
      --surface: #fff;
      --ink: #202620;
      --muted: #788078;
      --line: #e7e9e2;
      --green: #527a5d;
      --green-pale: #e5eee4;
      --coral: #d66e53;
      --coral-pale: #f8e9e3;
      --blue: #547a98;
      --blue-pale: #e7eef3;
      --shadow: 0 2px 8px rgb(34 46 36 / 5%), 0 1px 2px rgb(34 46 36 / 4%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.45 "Segoe UI", Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .shell { max-width: 1480px; margin: 0 auto; padding: 0 42px 54px; }
    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .01em; }
    .brand-mark {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 9px; background: var(--green); color: white; font-size: 15px;
    }
    .top-right { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
    .avatar-stack { display: flex; padding-left: 7px; }
    .avatar {
      width: 29px; height: 29px; margin-left: -7px; display: grid; place-items: center;
      border: 2px solid var(--paper); border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700;
    }
    .avatar.a { background: #c9775e; } .avatar.b { background: #688b71; }
    .avatar.c { background: #62819a; } .avatar.d { background: #a78355; }
    main { padding-top: 40px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .heading-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    h1 { margin: 7px 0 5px; font: 500 36px/1.12 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    .subtitle { margin: 0; color: var(--muted); }
    .primary-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 15px; border: 0; border-radius: 6px;
      background: var(--green); color: #fff; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .primary-button:hover { background: #42684d; transform: translateY(-1px); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 30px 0 15px; }
    .summary { color: var(--muted); font-size: 12px; }
    .summary strong { color: var(--ink); font-weight: 650; }
    .search-wrap { position: relative; width: min(250px, 42vw); }
    .search-wrap span { position: absolute; top: 8px; left: 11px; color: #818981; font-size: 16px; }
    .search {
      width: 100%; height: 36px; padding: 0 12px 0 34px; outline: none;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    }
    .search:focus, input:focus, select:focus, textarea:focus { border-color: #8ca993; box-shadow: 0 0 0 3px rgb(82 122 93 / 12%); }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .column { min-width: 0; }
    .column-heading {
      min-height: 43px; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding: 0 2px; border-bottom: 1px solid var(--line);
    }
    .column-title { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
    [data-status="progress"] .dot { background: #d5a248; }
    [data-status="done"] .dot { background: var(--green); }
    .count { color: var(--muted); font-size: 12px; font-weight: 500; }
    .cards { min-height: 70px; display: grid; gap: 10px; padding: 2px; border-radius: 7px; transition: background .15s; }
    .cards.drag-over { background: #e9eee7; }
    .task {
      padding: 15px; border: 1px solid #eceee8; border-radius: 6px; background: var(--surface); box-shadow: var(--shadow);
      cursor: grab; animation: appear .24s ease both;
    }
    .task:active { cursor: grabbing; }
    .task.dragging { opacity: .42; }
    .task-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tag { padding: 4px 7px; border-radius: 4px; background: var(--blue-pale); color: var(--blue); font-size: 10px; font-weight: 700; }
    .tag.design { background: var(--coral-pale); color: #b65d46; }
    .tag.ops { background: #f3eddb; color: #94712d; }
    .priority { color: #9a6d35; font-size: 10px; font-weight: 650; }
    .priority.high { color: #bf5b49; }
    .task h3 { margin: 12px 0 5px; font-size: 14px; line-height: 1.35; font-weight: 650; }
    .task p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .task-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 17px; padding-top: 11px; border-top: 1px solid #f0f1ed; }
    .assignee { display: flex; align-items: center; gap: 7px; color: #626b63; font-size: 11px; }
    .mini-avatar { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: white; font-size: 9px; font-weight: 700; }
    .due { color: var(--muted); font-size: 10px; }
    .delete-task { width: 25px; height: 25px; border: 0; border-radius: 4px; background: transparent; color: #9aa19a; cursor: pointer; font-size: 16px; }
    .delete-task:hover { background: var(--coral-pale); color: #b65d46; }
    .empty { padding: 17px 12px; border: 1px dashed #dfe3dc; border-radius: 6px; color: #909890; text-align: center; font-size: 12px; }
    dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 20px 70px rgb(28 37 29 / 22%); }
    dialog::backdrop { background: rgb(25 34 27 / 42%); }
    .dialog-content { padding: 23px; }
    .dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .dialog-heading h2 { margin: 0; font: 500 25px Georgia, "Times New Roman", serif; }
    .close-button { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label { color: #59635a; font-size: 12px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; min-height: 38px; padding: 8px 10px; outline: none; border: 1px solid var(--line); border-radius: 5px; background: white; }
    .field textarea { min-height: 74px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .secondary-button { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 5px; background: white; cursor: pointer; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .shell { padding: 0 20px 36px; }
      main { padding-top: 30px; }
      .board { grid-template-columns: 1fr; gap: 23px; }
      .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
      .column-heading { margin-bottom: 8px; }
    }
    @media (max-width: 480px) {
      .shell { padding-right: 15px; padding-left: 15px; }
      .topbar { height: 60px; }
      .top-right > span:first-child { display: none; }
      h1 { font-size: 31px; }
      .heading-row { align-items: flex-start; }
      .heading-row .primary-button { min-height: 37px; padding: 0 10px; font-size: 12px; }
      .toolbar { margin-top: 23px; }
      .summary { max-width: 52%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">T</span><span>teamboard</span></div>
      <div class="top-right">
        <span>Product team</span>
        <div class="avatar-stack" aria-label="Team members">
          <span class="avatar a" title="Maya Chen">MC</span><span class="avatar b" title="Leo Martin">LM</span>
          <span class="avatar c" title="Ava Patel">AP</span><span class="avatar d" title="Noah Kim">NK</span>
        </div>
      </div>
    </header>
    <main>
      <div class="heading-row">
        <div>
          <div class="eyebrow">Workspace / Product</div>
          <h1>Team task board</h1>
          <p class="subtitle">A clear view of what we're making together.</p>
        </div>
        <button class="primary-button" id="open-dialog"><span aria-hidden="true">+</span> Add task</button>
      </div>
      <div class="toolbar">
        <div class="summary" id="summary" aria-live="polite"></div>
        <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" class="search" type="search" placeholder="Search tasks" aria-label="Search tasks"></label>
      </div>
      <section class="board" aria-label="Team tasks">
        <section class="column" data-status="todo" aria-label="To do">
          <div class="column-heading"><div class="column-title"><span class="dot"></span>To do <span class="count"></span></div></div>
          <div class="cards" data-drop="todo"></div>
        </section>
        <section class="column" data-status="progress" aria-label="In progress">
          <div class="column-heading"><div class="column-title"><span class="dot"></span>In progress <span class="count"></span></div></div>
          <div class="cards" data-drop="progress"></div>
        </section>
        <section class="column" data-status="done" aria-label="Done">
          <div class="column-heading"><div class="column-title"><span class="dot"></span>Done <span class="count"></span></div></div>
          <div class="cards" data-drop="done"></div>
        </section>
      </section>
    </main>
  </div>
  <dialog id="task-dialog">
    <form class="dialog-content" id="task-form">
      <div class="dialog-heading"><h2>New task</h2><button class="close-button" type="button" aria-label="Close" id="close-dialog">×</button></div>
      <div class="field"><label for="task-title">Task name</label><input id="task-title" name="title" required maxlength="90" placeholder="What needs to be done?"></div>
      <div class="field"><label for="task-description">Description</label><textarea id="task-description" name="description" maxlength="180" placeholder="Add a little context"></textarea></div>
      <div class="form-row">
        <div class="field"><label for="task-category">Category</label><select id="task-category" name="category"><option>Product</option><option>Design</option><option>Operations</option></select></div>
        <div class="field"><label for="task-status">Status</label><select id="task-status" name="status"><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="task-assignee">Assignee</label><select id="task-assignee" name="assignee"><option>Maya Chen</option><option>Leo Martin</option><option>Ava Patel</option><option>Noah Kim</option></select></div>
        <div class="field"><label for="task-due">Due date</label><input id="task-due" name="due" type="date"></div>
      </div>
      <div class="form-actions"><button class="secondary-button" type="button" id="cancel-dialog">Cancel</button><button class="primary-button" type="submit">Create task</button></div>
    </form>
  </dialog>
  <script>
    const people = {
      "Maya Chen": { initials: "MC", color: "#c9775e" },
      "Leo Martin": { initials: "LM", color: "#688b71" },
      "Ava Patel": { initials: "AP", color: "#62819a" },
      "Noah Kim": { initials: "NK", color: "#a78355" }
    };
    const starterTasks = [
      { id: 1, title: "Map the onboarding journey", description: "Review the first-session flow and flag places where people get stuck.", category: "Product", priority: "High", assignee: "Maya Chen", due: "2026-11-25", status: "todo" },
      { id: 2, title: "Collect customer interview notes", description: "Pull the recurring themes from this week's conversations.", category: "Research", priority: "Medium", assignee: "Noah Kim", due: "2026-11-27", status: "todo" },
      { id: 3, title: "Refresh the empty states", description: "Bring the empty screens in line with the new visual direction.", category: "Design", priority: "High", assignee: "Ava Patel", due: "2026-11-24", status: "progress" },
      { id: 4, title: "Define launch success metrics", description: "Agree on the activation and retention signals for launch.", category: "Product", priority: "Medium", assignee: "Leo Martin", due: "2026-11-28", status: "progress" },
      { id: 5, title: "Set up weekly team check-in", description: "Create a lightweight agenda and recurring calendar invite.", category: "Operations", priority: "Low", assignee: "Maya Chen", due: "2026-11-20", status: "done" }
    ];
    let tasks;
    try { tasks = JSON.parse(localStorage.getItem("teamboard-tasks")) || starterTasks; }
    catch { tasks = starterTasks; }

    const board = document.querySelector(".board");
    const search = document.querySelector("#search");
    const dialog = document.querySelector("#task-dialog");
    const form = document.querySelector("#task-form");
    const initialsFor = name => people[name]?.initials || name.split(/\s+/).map(part => part[0]).join("").slice(0, 2).toUpperCase();
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

    function render() {
      const query = search.value.trim().toLowerCase();
      let totalShown = 0;
      board.querySelectorAll(".column").forEach(column => {
        const status = column.dataset.status;
        const cards = column.querySelector(".cards");
        const visible = tasks.filter(task => task.status === status && `${task.title} ${task.description} ${task.category} ${task.assignee}`.toLowerCase().includes(query));
        totalShown += visible.length;
        column.querySelector(".count").textContent = visible.length;
        cards.innerHTML = visible.length ? visible.map(task => {
          const person = people[task.assignee] || { initials: initialsFor(task.assignee), color: "#788078" };
          const categoryClass = task.category === "Design" ? "design" : task.category === "Operations" ? "ops" : "";
          const due = task.due ? new Date(`${task.due}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "No due date";
          return `<article class="task" draggable="true" data-id="${task.id}">
            <div class="task-top"><span class="tag ${categoryClass}">${escapeHtml(task.category)}</span><span class="priority ${task.priority === "High" ? "high" : ""}">${escapeHtml(task.priority || "")}</span></div>
            <h3>${escapeHtml(task.title)}</h3><p>${escapeHtml(task.description || "No description added.")}</p>
            <div class="task-footer"><span class="assignee"><span class="mini-avatar" style="background:${person.color}">${escapeHtml(person.initials)}</span>${escapeHtml(task.assignee)}</span><span class="due">${escapeHtml(due)}</span><button class="delete-task" type="button" data-delete="${task.id}" aria-label="Delete ${escapeHtml(task.title)}" title="Delete task">×</button></div>
          </article>`;
        }).join("") : `<div class="empty">${query ? "No matching tasks" : "Drop a task here"}</div>`;
      });
      document.querySelector("#summary").innerHTML = `<strong>${totalShown}</strong> task${totalShown === 1 ? "" : "s"}${query ? " found" : ` · <strong>${tasks.filter(task => task.status === "done").length}</strong> completed`}`;
      localStorage.setItem("teamboard-tasks", JSON.stringify(tasks));
    }

    document.querySelector("#open-dialog").addEventListener("click", () => dialog.showModal());
    document.querySelector("#close-dialog").addEventListener("click", () => dialog.close());
    document.querySelector("#cancel-dialog").addEventListener("click", () => dialog.close());
    search.addEventListener("input", render);
    form.addEventListener("submit", event => {
      event.preventDefault();
      const values = new FormData(form);
      tasks.unshift({
        id: Date.now(), title: values.get("title").trim(), description: values.get("description").trim(),
        category: values.get("category"), priority: "Medium", assignee: values.get("assignee"), due: values.get("due"), status: values.get("status")
      });
      form.reset(); dialog.close(); render();
    });
    board.addEventListener("click", event => {
      const button = event.target.closest("[data-delete]");
      if (button) { tasks = tasks.filter(task => task.id !== Number(button.dataset.delete)); render(); }
    });
    board.addEventListener("dragstart", event => {
      const card = event.target.closest(".task");
      if (!card) return;
      event.dataTransfer.setData("text/plain", card.dataset.id);
      event.dataTransfer.effectAllowed = "move";
      requestAnimationFrame(() => card.classList.add("dragging"));
    });
    board.addEventListener("dragend", event => event.target.closest(".task")?.classList.remove("dragging"));
    board.querySelectorAll("[data-drop]").forEach(target => {
      target.addEventListener("dragover", event => { event.preventDefault(); target.classList.add("drag-over"); });
      target.addEventListener("dragleave", event => { if (!target.contains(event.relatedTarget)) target.classList.remove("drag-over"); });
      target.addEventListener("drop", event => {
        event.preventDefault(); target.classList.remove("drag-over");
        const task = tasks.find(item => item.id === Number(event.dataTransfer.getData("text/plain")));
        if (task) { task.status = target.dataset.drop; render(); }
      });
    });
    render();
  </script>
</body>
</html>
